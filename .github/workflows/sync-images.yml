name: Mirror images
on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "products.json"
      - "manual-images/**"
      - "scripts/sync-images.mjs"
concurrency:
  group: mirror-images
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: node scripts/sync-images.mjs
      - run: |
          git config user.name "image-sync"
          git config user.email "image-sync@users.noreply.github.com"
          git add images image-map.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Mirror images"
            git pull --rebase
            git push
          fi
